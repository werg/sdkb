name: CPU correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[hf,dev]'
      - run: ruff check src tests scripts
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: sdkb launch --recipe recipes/offline_smoke.yaml --output runs/ci-smoke
      - run: sdkb launch --recipe recipes/offline_smoke.yaml --output runs/ci-smoke --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python }}
          path: test-results.xml
