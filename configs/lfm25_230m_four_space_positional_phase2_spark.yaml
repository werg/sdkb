# Phase 2 positional interface. Initialize from a completed 32-position expansion
# checkpoint; do not initialize this configuration directly from a flat Phase 1 run.
model:
  backend: hf
  model_id: LiquidAI/LFM2.5-230M
  revision: 40cb2ad3b3044d5a41eee083a6103c8b523afa45
  loops: 2
  recurrence_mode: middle_block
  recurrent_start: 4
  recurrent_end: 10
  writer_loops: 1
  backbone_train_scope: all
  gradient_checkpointing: true
  freeze_backbone: true
memory:
  key_dim: 64
  write_slots: 32
  read_slots: 32
  payload_dims: [1024, 2048, 4096, 8192]
  payload_layout: positional
  neighbors: [128, 64, 32, 16]
  reader_width: 256
  reader_rounds: 3
  reader: mlp
  chunk_size: 8
  checkpoint_chunks: true
  storage_dtype: bfloat16
  compaction: none
  read_timing: loop_boundary
  read_steps: 1
  distance_gating: true
  gate_density_k: 8
  gate_min_temperature: 0.02
  gate_max_temperature: 0.5
  gate_initial_temperature: 0.1
  gate_max_radius_adjustment: 0.25
train:
  seed: 1701
  steps: 1000
  learning_rate: 0.00005
  backbone_learning_rate: 0.000005
  optimizer: muon
  weight_decay: 0.01
  gradient_accumulation: 1
  batch_size: 1
  sampling_policy: shuffled_passes
  precision: bf16
  device: cuda
  replay: true
  live_fraction: 1.0
  arm: memory
  retrieval: oracle
  routing_weight: 1.0
  routing_warmup: 1000
  support_gate_floor: 0.05
  writer_replay_records_per_site: 4
  threads: 8
  log_every: 10
  checkpoint_every: 10000
  keep_checkpoints: 2
  max_source_tokens: 256
  max_prompt_tokens: 512
  max_target_tokens: 256
  min_free_disk_bytes: 21474836480
  wandb_mode: offline
  wandb_group: four-space-positional-phase2
