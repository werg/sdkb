# Checkpointing-off validated for the short binding distribution only.
model:
  backend: hf
  model_id: LiquidAI/LFM2.5-230M
  revision: 40cb2ad3b3044d5a41eee083a6103c8b523afa45
  loops: 2
  tiny_width: 64
  tiny_layers: 2
  tiny_heads: 4
  gradient_checkpointing: false
  freeze_backbone: false
  recurrence_mode: middle_block
  recurrent_start: 4
  recurrent_end: 10
  recurrent_input_mix: 0.1
  recurrent_update_mix: 0.1
  writer_loops: 1
  backbone_train_scope: all
memory:
  key_dim: 64
  write_slots: 8
  read_slots: 8
  payload_dims:
  - 2048
  neighbors:
  - 4
  reader_width: 256
  reader_rounds: 3
  reader: attention
  chunk_size: 4
  checkpoint_chunks: false
  storage_dtype: bfloat16
  compaction: none
  compact_records: 2
  compaction_probability: 0.25
  compaction_loss_weight: 0.1
  compaction_warmup: 100
  noise_std: 0.0
  quantization_step: 0.0
  read_timing: loop_boundary
  read_steps: 1
train:
  seed: 17
  steps: 200
  learning_rate: 0.0001
  backbone_learning_rate: 5.0e-06
  gradient_accumulation: 4
  clip_grad_norm: 1.0
  precision: bf16
  device: cuda
  replay: true
  verify_replay: false
  live_fraction: 1.0
  train_worlds: 128
  distractors: 2
  eval_worlds: 16
  log_every: 10
  max_source_tokens: 512
  max_prompt_tokens: 4096
  arm: memory
  retrieval: oracle
  routing_weight: 0.1
  routing_warmup: 100
  threads: 8
  max_target_tokens: 512
  checkpoint_every: 1000
  oracle_anchor_weight: 0.0
  oracle_anchor_loops: 1
  evidence_scope: required
  optimizer: muon
  muon_momentum: 0.95
  muon_ns_steps: 5
  weight_decay: 0.01
  keep_checkpoints: 2
  archive_dir: null
  min_free_disk_bytes: 10737418240
  cuda_memory_fraction: 0.35
  min_system_available_bytes: 8589934592
  stall_timeout_seconds: 300
  wandb_mode: offline
  wandb_group: binding-muon
