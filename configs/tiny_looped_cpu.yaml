model:
  backend: tiny
  model_id: LiquidAI/LFM2.5-230M
  revision: main
  loops: 2
  tiny_width: 32
  tiny_layers: 4
  tiny_heads: 4
  gradient_checkpointing: false
  freeze_backbone: false
  recurrence_mode: middle_block
  recurrent_start: 1
  recurrent_end: 3
  writer_loops: 1
  recurrent_input_mix: 0.1
  recurrent_update_mix: 0.1
memory:
  key_dim: 12
  write_slots: 2
  read_slots: 2
  payload_dims:
  - 24
  neighbors:
  - 2
  reader_width: 24
  reader_rounds: 2
  reader: mlp
  chunk_size: 2
  checkpoint_chunks: false
  storage_dtype: bfloat16
  compaction: none
  compact_records: 2
  compaction_probability: 0.25
  compaction_loss_weight: 0.1
  compaction_warmup: 100
  noise_std: 0.0
  quantization_step: 0.0
  read_timing: loop_boundary
  read_steps: 1
train:
  seed: 17
  steps: 2
  learning_rate: 0.001
  backbone_learning_rate: 0.001
  gradient_accumulation: 1
  clip_grad_norm: 1.0
  precision: fp32
  device: cpu
  replay: true
  verify_replay: true
  live_fraction: 0.5
  train_worlds: 16
  distractors: 2
  eval_worlds: 4
  log_every: 10
  max_source_tokens: 512
  max_prompt_tokens: 1024
  arm: memory
  retrieval: oracle
  routing_weight: 0.1
  routing_warmup: 100
  threads: 2
  checkpoint_every: 1
  max_target_tokens: 512
  oracle_anchor_loops: 1
