[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "external-latent-memory"
version = "0.2.0"
description = "Transfer-trained external latent memory, recurrent set readers, and conditional compaction"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26", "safetensors>=0.5", "PyYAML>=6"]

[project.optional-dependencies]
hf = ["transformers==5.17.0"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
elm = "elm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires optional Transformers, model downloads, or accelerator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
