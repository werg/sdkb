# Pilot budgets, not a demonstrated conversion result.
base_config: configs/lfm25_230m_looped_spark.yaml
protocol: prefix
seed: 17
validation_fraction: 0.1
sources:
- name: hermes
  max_rows: 64
  shuffle_buffer: 16
- name: ultrachat
  max_rows: 64
  shuffle_buffer: 16
preparation:
  max_supports: 4
  max_targets_per_trajectory: 3
  recent_messages: 1
  recent_tokens: 512
  task_tokens: 160
stages:
- name: text_bootstrap
  arm: oracle_text
  steps: 2
  loops: 1
  freeze_backbone: false
- name: recurrence_bridge
  arm: oracle_text
  steps: 2
  loops: 2
  freeze_backbone: true
  init_from: text_bootstrap
  parent_kl_weight: 0.1
- name: latent_warmup
  arm: memory
  steps: 2
  loops: 2
  freeze_backbone: true
  init_from: recurrence_bridge
- name: recurrent_joint
  arm: memory
  steps: 2
  loops: 3
  loop_counts:
  - 2
  - 3
  freeze_backbone: false
  backbone_train_scope: recurrent_core
  init_from: latent_warmup
  oracle_anchor_weight: 0.1
  oracle_anchor_loops: 1
evaluation:
  max_episodes: 2
  causal_worlds: 1
