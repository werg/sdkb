base_config: configs/lfm25_230m_trajectories_spark.yaml
protocol: prefix
seed: 17
validation_fraction: 0.1
sources:
- name: openhands
  max_rows: 4000
  shuffle_buffer: 256
preparation:
  max_supports: 4
  max_targets_per_trajectory: 3
  recent_messages: 1
  recent_tokens: 512
  task_tokens: 160
stages:
- name: text_bootstrap
  arm: oracle_text
  steps: 200
  freeze_backbone: false
- name: latent_warmup
  arm: memory
  steps: 400
  freeze_backbone: true
  init_from: text_bootstrap
- name: latent_joint
  arm: memory
  steps: 400
  freeze_backbone: false
  init_from: latent_warmup
  oracle_anchor_weight: 0.1
evaluation:
  max_episodes: 64
  causal_worlds: 32
